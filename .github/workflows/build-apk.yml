name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # GitHub Release yaratish uchun

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      # AdMob (ixtiyoriy): berilmasa release ham Google TEST reklamalari bilan chiqadi
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Repodagi gradle-wrapper.jar o'rniga rasmiy Gradle ishlatiladi (AGP 8.9.1 uchun 8.11.1 kerak)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ---------------------------------------------------------------- TEST APK (debug)
      - name: Build Debug APK
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} -PgithubRepo=${{ github.repository }} --stacktrace

      # Play 16 KB talabi: natija logda ko'rinadi (build yiqilmaydi, faqat ogohlantiradi)
      - name: Check 16 KB page size (debug APK)
        continue-on-error: true
        run: python3 tools/check_16kb.py app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DublajUz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          overwrite: true

      # Har bir push'dan keyin yangi test reliz (debug APK): test APK ichidagi "yangilanish tekshiruvi" shuni o'qiydi
      - name: Prepare APK for release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/*.apk DublajUz.apk

      - name: Publish build release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DublajUz 0.4.${{ github.run_number }} (test)
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: DublajUz.apk
          fail_on_unmatched_files: true

      # ---------------------------------------------------------------- PLAY (release AAB)
      # KEYSTORE_B64 Secret bo'lmasa ish QIZIL bo'ladi (jimgina o'tkazib yubormaydi) — AAB yo'qligining sababi shu edi.
      - name: Check upload key secrets
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing KEYSTORE_B64"
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "${{ secrets.KEY_ALIAS }}" ] && missing="$missing KEY_ALIAS"
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=AAB yig'ilmadi::Settings > Secrets > Actions ga qo'shing:$missing  (PLAY_CHECKLIST.md, A bo'limi)"
            exit 1
          fi

      - name: Decode upload keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Release AAB + APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease -PbuildNumber=${{ github.run_number }} -PgithubRepo=${{ github.repository }} --stacktrace

      - name: Verify AAB signature
        run: |
          ls -la app/build/outputs/bundle/release/
          jarsigner -verify app/build/outputs/bundle/release/*.aab | head -3

      - name: Check 16 KB page size (release APK)
        continue-on-error: true
        run: python3 tools/check_16kb.py app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB (Play Console ga yuklang)
        uses: actions/upload-artifact@v4
        with:
          name: DublajUz-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
          overwrite: true
          if-no-files-found: error

      - name: Upload Release APK (Play'ga o'xshash test)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DublajUz-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          overwrite: true
